<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>泌約｜旗山泌尿科</title>
  <style>
    :root { --pine:#2F6B5E; --paper:#F6F3EE; --ink:#1C2421; --muted:#6B655C; --linen:#E8E2D6; --card:#FFFcf7; --warn:#8B3A2F; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
    .top { display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:#fffdf9; border-bottom:1px solid var(--linen); position:sticky; top:0; }
    .brand { font-weight:700; display:flex; gap:8px; align-items:center; }
    .mark { width:32px; height:32px; border-radius:10px; background:var(--pine); color:#fff; display:flex; align-items:center; justify-content:center; }
    .wrap { max-width:560px; margin:0 auto; padding:28px 18px 80px; }
    h1 { font-family:"Songti TC","PMingLiU",serif; font-size:30px; line-height:1.25; margin:0 0 10px; }
    p { color:var(--muted); line-height:1.6; }
    .card { background:var(--card); border:1px solid var(--linen); border-radius:16px; padding:16px; margin:14px 0; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, select { width:100%; padding:12px; border:1px solid #C4B8A5; border-radius:10px; font:inherit; }
    .btn { border:0; border-radius:12px; padding:12px 16px; background:var(--pine); color:#fff; font-weight:700; width:100%; margin-top:12px; cursor:pointer; }
    .btn.ghost { background:transparent; color:var(--ink); border:1px solid #C4B8A5; }
    .warn { background:#f6e6e3; color:var(--warn); padding:10px 12px; border-radius:12px; font-size:13px; }
    .ok { background:#e3efe9; color:var(--pine); padding:10px 12px; border-radius:12px; font-size:13px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><div class="mark">泌</div> 泌約　旗山泌尿科</div>
  </div>
  <div class="wrap" id="app"></div>
  <script>
  var KEY = "miyue.public.v1";
  var DOCS = [
    { id: "d_tseng", name: "曾淑芬" },
    { id: "d_yu", name: "尤政仁" },
    { id: "d_huang", name: "黃冠霖" },
    { id: "d_chang", name: "張道安" }
  ];
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; }
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function view() {
    var s = load();
    var app = document.getElementById("app");
    if (s && s.email) {
      app.innerHTML = '<h1>已進入泌約</h1>' +
        '<div class="ok">' + (s.role === "doctor" ? s.clinic + "　" + s.name + " 醫師" : s.name + "（病人）") + '<br/>' + s.email + "</div>" +
        '<div class="card"><p>這是旗山泌尿科術後／自費溝通頁。請用醫師給的邀請碼加入自己的案件。急症請打 119 或回急診，不要只在這裡留言。</p>' +
        '<label>邀請碼</label><input id="code" placeholder="例如 HX7K-19" />' +
        '<button class="btn" id="join">加入案件</button></div>' +
        '<button class="btn ghost" id="out">登出</button>' +
        '<p>請勿輸入身分證、完整病歷。</p>';
      document.getElementById("out").onclick = function () { localStorage.removeItem(KEY); view(); };
      document.getElementById("join").onclick = function () {
        var c = (document.getElementById("code").value || "").trim().toUpperCase();
        if (!c) return alert("請輸入醫師交給您的邀請碼");
        alert("已記錄邀請碼 " + c + "。示範版資料存在這支手機瀏覽器。");
      };
      return;
    }
    app.innerHTML = '<p class="warn">示範通道・請勿輸入真實病歷或身分證</p>' +
      "<h1>用 Google 信箱進入，不必加 LINE。</h1>" +
      "<p>把這個網址傳給病人即可。iPhone Safari 可直接開，不會跳到 Signing you in。</p>" +
      '<div class="card"><label>Google 信箱</label><input id="email" type="email" inputmode="email" placeholder="name@gmail.com" />' +
      '<label>稱呼</label><input id="name" placeholder="例如 陳先生" />' +
      '<label>我是</label><select id="role"><option value="patient">病人／家屬</option><option value="doctor">旗山泌尿科醫師</option></select>' +
      '<label>若是醫師，請選自己</label><select id="doc">' +
      DOCS.map(function (d) { return '<option value="' + d.id + '">' + d.name + " 主治醫師</option>"; }).join("") +
      '</select><button class="btn" id="go">用這組 Google 信箱進入</button></div>' +
      '<p>同一組信箱下次可再進來。資料目前存在這支手機，不會同步到其他人的手機。</p>';
    document.getElementById("go").onclick = function () {
      var email = (document.getElementById("email").value || "").trim().toLowerCase();
      var name = (document.getElementById("name").value || "").trim();
      var role = document.getElementById("role").value;
      var docId = document.getElementById("doc").value;
      if (!email || email.indexOf("@") < 1) return alert("請輸入完整 Gmail，例如 name@gmail.com");
      var doc = DOCS.filter(function (d) { return d.id === docId; })[0];
      save({ email: email, role: role, name: role === "doctor" ? doc.name : (name || email.split("@")[0]), clinic: "旗山泌尿科", at: new Date().toISOString() });
      view();
    };
  }
  view();
  </script>
</body>
</html>
