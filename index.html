<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="robots" content="noindex,nofollow"/>
<title>泌約｜旗山泌尿科</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="stick" id="stick">
<div class="top">
<button type="button" class="brand" id="home"><span class="mark" aria-hidden="true">泌</span> 泌約　旗山泌尿科</button>
<span id="who" class="muted"></span>
</div>
<div id="casebar" class="casebar"></div>
</header>
<main id="app" class="wrap"></main>
<button type="button" class="sos" id="sos">我有緊急狀況</button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="emergency" class="lb" role="dialog" aria-modal="true" aria-labelledby="emer-title">
<div class="panel">
<div class="warn emer" id="emer-body">
<strong id="emer-title">【緊急狀況　請不要等 APP 回覆】</strong><br>
出現以下任一情形，請直接到急診，或打 <a href="tel:119">119</a>，或旗山醫院總機 <a href="tel:076613811">07-6613811</a> 轉急診：<br>
・大量血尿或有血塊<br>
・尿不出來，或尿管不通<br>
・發燒或寒顫<br>
・劇烈腰痛或腹痛<br>
・傷口大量滲血<br>
・意識不清或喘<br>
APP 訊息不保證即時有人回覆，也不能取代看診。緊急時不要等 APP 回覆。<br>
本提示不是診斷，也不是治療建議。
<div class="emer-actions">
<a class="btn" href="tel:119">打 119</a>
<a class="btn" href="tel:076613811">打總機 07-6613811</a>
</div>
</div>
<button type="button" class="btn block" id="ackok" hidden>我了解</button>
<button type="button" class="btn block" id="stillSend" hidden>仍要送出留言</button>
<button type="button" class="btn ghost block" id="emerClose">關閉</button>
</div>
</div>
<div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="照片">
<img id="lbimg" alt="">
<button type="button" class="btn ghost" id="lbx">關閉</button>
</div>
<noscript>
<div class="warn emer">
<strong>【緊急狀況　請不要等 APP 回覆】</strong><br>
出現以下任一情形，請直接到急診，或打 <a href="tel:119">119</a>，或旗山醫院總機 <a href="tel:076613811">07-6613811</a> 轉急診：<br>
・大量血尿或有血塊<br>
・尿不出來，或尿管不通<br>
・發燒或寒顫<br>
・劇烈腰痛或腹痛<br>
・傷口大量滲血<br>
・意識不清或喘<br>
APP 訊息不保證即時有人回覆，也不能取代看診。緊急時不要等 APP 回覆。<br>
本提示不是診斷，也不是治療建議。
</div>
</noscript>
<script>
document.getElementById("sos").addEventListener("click", function () {
  var box = document.getElementById("emergency");
  box.className = "lb on";
  box.removeAttribute("hidden");
});
document.getElementById("emerClose").addEventListener("click", function () {
  var box = document.getElementById("emergency");
  box.className = "lb";
  document.getElementById("stillSend").hidden = true;
});
</script>
<script src="qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
